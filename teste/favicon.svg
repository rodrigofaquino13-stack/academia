<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="30%" cy="22%" r="85%">
      <stop offset="0" stop-color="#2F4BC9"/><stop offset="0.55" stop-color="#16204A"/><stop offset="1" stop-color="#0E1222"/>
    </radialGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FA2FF"/><stop offset="1" stop-color="#3E68F5"/></linearGradient>
    <linearGradient id="amarelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD866"/><stop offset="1" stop-color="#F5B820"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) rotate(-30) scale(1)">
    <!-- barra -->
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#F3F5FA"/>
    <!-- anilhas azuis (grandes) -->
    <rect x="-150" y="-92" width="44" height="184" rx="14" fill="url(#azul)"/>
    <rect x="106" y="-92" width="44" height="184" rx="14" fill="url(#azul)"/>
    <!-- anilhas amarelas (menores) -->
    <rect x="-100" y="-62" width="30" height="124" rx="10" fill="url(#amarelo)"/>
    <rect x="70" y="-62" width="30" height="124" rx="10" fill="url(#amarelo)"/>
    <!-- presilhas -->
    <rect x="-64" y="-22" width="12" height="44" rx="5" fill="#F3F5FA"/>
    <rect x="52" y="-22" width="12" height="44" rx="5" fill="#F3F5FA"/>
  </g>
</svg>
