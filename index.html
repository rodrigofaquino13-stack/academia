  <body>
    <div id="root">
      <div id="carregando" style="min-height:100dvh;display:grid;place-content:center;gap:16px;text-align:center;padding:24px;background:#101216;color:#C9CED6;font:400 1rem/1.5 system-ui,sans-serif">
        <p id="carregando-txt" role="status" style="margin:0">Carregando…</p>
        <button id="carregando-btn" hidden onclick="location.reload()" style="min-height:48px;padding:0 24px;border:0;border-radius:999px;background:#5B82FF;color:#101216;font:650 1rem system-ui,sans-serif">Tentar de novo</button>
      </div>
    </div>
    <script>
      // Se o app não abrir em 10 s, explica e oferece tentar de novo
      setTimeout(function () {
        var t = document.getElementById('carregando-txt'), b = document.getElementById('carregando-btn')
        if (t && b) { t.textContent = 'Não deu para abrir o app. Confira a internet.'; b.hidden = false }
      }, 10000)
    </script>
